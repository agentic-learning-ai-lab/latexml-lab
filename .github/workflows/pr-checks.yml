name: pr-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unit tests
        run: npm test

      - name: shellcheck
        run: shellcheck convert.sh pdf.sh

      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

      # End to end on arXiv's image: the bindings in bindings/ must load
      # and LaTeXML must report no errors.
      - name: Convert the fixture
        run: |
          ./convert.sh test/fixtures/boxes "$RUNNER_TEMP/out"
          if grep '^Error:' "$RUNNER_TEMP/out/latexml.log"; then exit 1; fi
          node -e '
            const h = require(process.argv[1]).html;
            const fail = m => { console.error(m); process.exit(1); };
            if ((h.match(/ltx_tcolorbox_title/g) || []).length !== 2) fail("expected 2 tcolorbox titles");
            if (!h.includes("im_start")) fail("lstnewenvironment lost its first line");
            console.log("fixture ok");
          ' "$RUNNER_TEMP/out/paper-content.json"

      # TikZ: pictures are compiled with real TeX in a wrapped source, a
      # resizebox around an \input is kept, and inline \tikz stays text.
      - name: Convert the TikZ fixture
        run: |
          ./convert.sh test/fixtures/tikz "$RUNNER_TEMP/tikz" | tee "$RUNNER_TEMP/tikz.log"
          grep -q '^tikz: pre-rendered 1$' "$RUNNER_TEMP/tikz.log"
          if grep '^Error:' "$RUNNER_TEMP/tikz/latexml.log"; then exit 1; fi
          node -e '
            const h = require(process.argv[1]).html;
            const m = /<img[^>]*x1\.png[^>]*width="(\d+)"/.exec(h);
            if (!m) { console.error("no pre-rendered picture"); process.exit(1); }
            // \resizebox{\textwidth}{!}: LaTeXML draws \textwidth as 660 px.
            if (Number(m[1]) < 600) { console.error("picture " + m[1] + " px wide, expected about 660"); process.exit(1); }
            console.log("tikz fixture ok");
          ' "$RUNNER_TEMP/tikz/paper-content.json"

      # PDF: both engines compile on the pinned TeX Live, and the same
      # source compiles to the same bytes.
      - name: Compile the fixtures to PDF
        run: |
          sudo apt-get install -y -qq qpdf poppler-utils >/dev/null
          ./pdf.sh test/fixtures/tikz "$RUNNER_TEMP/a.pdf" | tee "$RUNNER_TEMP/pdf.log"
          grep -q 'with pdflatex' "$RUNNER_TEMP/pdf.log"
          ./pdf.sh test/fixtures/tikz "$RUNNER_TEMP/b.pdf"
          cmp "$RUNNER_TEMP/a.pdf" "$RUNNER_TEMP/b.pdf"
          ./pdf.sh test/fixtures/xelatex "$RUNNER_TEMP/x.pdf" | tee "$RUNNER_TEMP/pdf.log"
          grep -q 'with xelatex' "$RUNNER_TEMP/pdf.log"
          pdftotext "$RUNNER_TEMP/x.pdf" - | grep -q 'LeCun'
